name: One-time Audit hub formatting
on:
  push:
    branches: [feature/audit-2.0]
    paths:
      - '.github/workflows/format-audit-hub.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audit-2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write js/modules/audit/ui/hub.js
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/audit/ui/hub.js
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style(audit): apply Prettier formatting to hub"
            git push origin HEAD:feature/audit-2.0
          fi
