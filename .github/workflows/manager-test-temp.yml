name: Temporary Manager tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.event.pull_request.head.ref == 'feature/manager-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
