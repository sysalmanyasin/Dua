name: Format audit calculator CSS

on:
  push:
    branches:
      - ui/compact-colorful-audit-calculator

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/compact-colorful-audit-calculator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format calculator stylesheet
        run: npx prettier --write css/audit.css
      - name: Commit formatted stylesheet
        run: |
          if git diff --quiet -- css/audit.css; then
            echo "Stylesheet is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/audit.css
          git commit -m "Format audit calculator stylesheet"
          git push origin HEAD:ui/compact-colorful-audit-calculator
