name: Temporary Manager precache update
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  precache:
    if: github.event.pull_request.head.ref == 'feature/manager-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sw-precache.mjs
      - name: Commit precache list
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js
          git commit -m 'Update service worker precache for Manager dashboard'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
