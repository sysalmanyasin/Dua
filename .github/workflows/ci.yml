name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Format Audit hub and commit formatter output
        run: |
          npx prettier --write js/modules/audit/ui/hub.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/audit/ui/hub.js
          if ! git diff --cached --quiet; then
            git commit -m "style(audit): apply Prettier formatting to hub"
            git push origin HEAD:feature/audit-2.0
          fi
      - run: npm run format:check
      - run: npm test
      - run: npm run check:secrets
      - run: npm run check:vendor
      - name: Lint workflow files
        run: pip install --quiet actionlint-py && actionlint

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run security tests
        run: bash supabase/tests/run.sh

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        working-directory: supabase/functions
        run: |
          for f in staff-login request-access claim-account admin-users sync-inventory-from-dropbox notify-ntfy; do
            deno check --no-lock "$f/index.ts"
          done
