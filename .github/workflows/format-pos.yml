name: Format Emergency POS changes
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/emergency-pos-candela-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/emergency-pos-candela-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write css/ebill.css js/modules/ebill/ui/pos.js
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/ebill.css js/modules/ebill/ui/pos.js
          git commit -m "Format Emergency POS changes"
          git push origin HEAD:feature/emergency-pos-candela-workflow
