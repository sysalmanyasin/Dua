name: Format Manager Dashboard
on:
  push:
    branches: [feature/bt-style-manager-dashboard]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write js/modules/manager/ui/dashboard.js css/manager-dashboard.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/manager/ui/dashboard.js css/manager-dashboard.css
          git commit -m "Format BT-style manager dashboard"
          git push
