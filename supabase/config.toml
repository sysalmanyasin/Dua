# Local-dev settings. For the hosted project set the same values in the dashboard (see docs/SETUP.md).
[auth]
enable_signup = false
minimum_password_length = 6
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Public entry points authenticate themselves (PIN lockout), so JWT verification is off.
[functions.staff-login]
verify_jwt = false
# admin-users checks the caller's JWT and users.manage itself.
[functions.admin-users]
verify_jwt = false
# sync-inventory-from-dropbox accepts a scheduler secret OR a user JWT with inventory.sync, and checks both itself.
[functions.sync-inventory-from-dropbox]
verify_jwt = false
# notify-push is called by pg_cron and the backup workflow with a shared secret header (no user JWT).
[functions.notify-push]
verify_jwt = false
# widget-today is called by the Android widget with a per-device secret (no user JWT); the database checks it.
[functions.widget-today]
verify_jwt = false
# attendance-event is called by the Android app with a per-device secret (no user JWT, even while Dua is closed); the database checks it.
[functions.attendance-event]
verify_jwt = false
